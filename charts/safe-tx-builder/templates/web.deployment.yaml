---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "safe-tx-builder.fullname" . }}

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "safe-tx-builder.fullname" . }}
  template:
    metadata:
      labels:
        app: {{ include "safe-tx-builder.fullname" . }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tx-builder
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required: an image built from a commit that has apps/tx-builder/scripts/static-serve.sh" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: /app/apps/tx-builder
          command: ["yarn", "static-serve"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: VITE_GATEWAY_URL
              value: {{ required "config.clientGateway.url is required" .Values.config.clientGateway.url | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ## The app is built on start, so the pod gets traffic only when the build is served.
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            failureThreshold: 3
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
