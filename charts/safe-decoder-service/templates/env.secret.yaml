{{ $pg := index .Values "safe-decoder-service-postgresql" }}
{{ $pg_auth := $pg.global.postgresql.auth }}

---
# Whoever has these values can mark any contract as trusted for DELEGATECALL, through the admin or the database
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safe-decoder-service.fullname" . }}-env
type: Opaque
stringData:
  SECRET_KEY: {{ required "config.secretKey is required: set a random secret, not stored in git" .Values.config.secretKey | quote }}
  ADMIN_PASSWORD: {{ required "config.admin.password is required: set it in the deployment values, not stored in git" .Values.config.admin.password | quote }}
  {{- if $pg.enabled }}
  DATABASE_URL: "postgresql+asyncpg://{{ $pg_auth.username }}:{{ required "safe-decoder-service-postgresql.global.postgresql.auth.password is required: set it in the deployment values, not stored in git" $pg_auth.password }}@{{ include "safe-decoder-service.postgresql.fullname" . }}:5432/{{ $pg_auth.database }}"
  {{- else }}
  DATABASE_URL: {{ required "config.database.url is required when safe-decoder-service-postgresql.enabled=false" .Values.config.database.url | quote }}
  {{- end }}
---
