---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "safe-decoder-service.fullname" . }}-env

data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ADMIN_USERNAME: {{ .Values.config.admin.username | quote }}

  ## Redis configuration
  {{- if index .Values "safe-decoder-service-redis" "enabled" }}
  REDIS_URL: "redis://{{ include "safe-decoder-service.redis.fullname" . }}-master:6379/0"
  {{- else }}
  REDIS_URL: {{ .Values.config.redis.url | quote }}
  {{- end }}

  ## AMQP configuration
  {{- if .Values.config.amqp.url }}
  RABBITMQ_AMQP_URL: {{ .Values.config.amqp.url | quote }}
  RABBITMQ_AMQP_EXCHANGE: {{ .Values.config.amqp.exchange | quote }}
  RABBITMQ_DECODER_EVENTS_QUEUE_NAME: {{ .Values.config.amqp.queue | quote }}
  {{- end }}
---
