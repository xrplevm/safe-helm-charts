---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "safe-decoder-service.fullname" . }}-web

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "safe-decoder-service.fullname" . }}-web
  template:
    metadata:
      labels:
        app: {{ include "safe-decoder-service.fullname" . }}-web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["docker/web/run_web.sh"]
          ports:
            - name: http
              containerPort: 8888
          envFrom:
            - configMapRef:
                name: {{ include "safe-decoder-service.fullname" . }}-env
            - secretRef:
                name: {{ include "safe-decoder-service.fullname" . }}-env
          volumeMounts:
            # run_web.sh copies the static files and creates the gunicorn socket here
            - name: nginx-shared
              mountPath: /nginx
          livenessProbe:
            httpGet:
              path: /health
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8888
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: nginx-shared
          emptyDir: {}

      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
