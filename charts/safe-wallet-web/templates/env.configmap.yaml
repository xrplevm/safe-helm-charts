{{- define "safe-wallet-web.envConfigMap" -}}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "safe-wallet-web.fullname" . }}-env

data:
  {{- $extra := .Values.extraEnvVars | default dict }}
  ## Common properties
  NEXT_PUBLIC_SAFE_VERSION: "{{ .Values.config.safeVersion }}"
  {{- $chainId := coalesce (get $extra "NEXT_PUBLIC_DEFAULT_MAINNET_CHAIN_ID") .Values.config.defaultChainId }}
  NEXT_PUBLIC_DEFAULT_MAINNET_CHAIN_ID: {{ required "Set config.defaultChainId" $chainId | toString | quote }}

  # Infura (not used?)
  NEXT_PUBLIC_INFURA_TOKEN: ""
  # infura token used by Safe Apps
  NEXT_PUBLIC_SAFE_APPS_INFURA_TOKEN: ""

  # Transaction simulation
  NEXT_PUBLIC_TENDERLY_SIMULATE_ENDPOINT_URL: ""
  NEXT_PUBLIC_TENDERLY_PROJECT_NAME: ""
  NEXT_PUBLIC_TENDERLY_ORG_NAME: ""

  # Flag to switch to the production environment (redirect urls, gateway url, etc)
  NEXT_PUBLIC_IS_PRODUCTION: "true"
  NEXT_PUBLIC_GATEWAY_URL_PRODUCTION: {{ .Values.config.clientGateway.url }}
  NEXT_PUBLIC_GATEWAY_URL_STAGING: ""
  {{- $appUrl := get $extra "NEXT_PUBLIC_APP_URL" | default .Values.config.appUrl }}
  {{- if and (not $appUrl) .Values.ingress.enabled .Values.ingress.host }}
  {{- $appUrl = printf "https://%s" .Values.ingress.host }}
  {{- end }}
  NEXT_PUBLIC_APP_URL: {{ required "Set config.appUrl, or enable ingress with ingress.host" $appUrl | quote }}
  # Transaction Builder app. Empty: the wallet's Transaction Builder links open the app list.
  NEXT_PUBLIC_TX_BUILDER_URL: {{ get $extra "NEXT_PUBLIC_TX_BUILDER_URL" | default .Values.config.txBuilderUrl | default "" | quote }}

  # Access keys
  NEXT_PUBLIC_SENTRY_DSN: ""
  NEXT_PUBLIC_BEAMER_ID: ""

  # Wallet specific variables
  NEXT_PUBLIC_WC_PROJECT_ID: {{ .Values.config.walletConnect.projectId }}
  NEXT_PUBLIC_WC_BRIDGE:  {{ .Values.config.walletConnect.bridge }}
  NEXT_PUBLIC_FORTMATIC_KEY: ""
  NEXT_PUBLIC_PORTIS_KEY: ""
  NEXT_PUBLIC_CYPRESS_MNEMONIC: ""

  # sets the listener only for localhost
  REVERSE_PROXY_UI_PORT: "3000"

  ## Extra envs
  {{- with omit $extra "NEXT_PUBLIC_DEFAULT_MAINNET_CHAIN_ID" "NEXT_PUBLIC_APP_URL" "NEXT_PUBLIC_TX_BUILDER_URL" }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
{{- end }}
{{- if not .Values.parentManaged }}
{{ include "safe-wallet-web.envConfigMap" . }}
{{- end }}