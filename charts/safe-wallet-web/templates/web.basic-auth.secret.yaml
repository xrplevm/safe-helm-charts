{{- if .Values.basicAuth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safe-wallet-web.fullname" . }}-basic-auth
type: Opaque
stringData:
  auth: {{ htpasswd (required "basicAuth.user is required" .Values.basicAuth.user) (required "basicAuth.password is required" .Values.basicAuth.password) | quote }}
{{- end }}
