# Default values for safe-wallet-web.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## Provide a name in place of safe-stack for `app:` labels
##
nameOverride: ""
## Provide a name to substitute for the full names of resources
##
fullnameOverride: ""
## Reference to one or more secrets to be used when pulling images
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
##
imagePullSecrets: []

replicaCount: 1

## XRPL EVM Multisig: rebranded fork of safe-wallet-web (GPL-3.0), built by the
## "Build image" workflow of https://github.com/xrplevm/safe-wallet-web. The tag is the commit SHA.
## The fork branch is named 1.82.0, but it is upstream v1.81.0 plus upstream dev commits, not the v1.82.0 release.
## Do not use safeglobal/safe-wallet-web: it ships the Safe trademarks.
image:
  repository: ghcr.io/xrplevm/safe-wallet-web
  ## Tag and digest: the tag shows the commit, the digest stops a re-push from changing what runs.
  tag: 320d73311b330ee797d57c9ac8ac08befec224cf@sha256:001ee562646d8749160fbaa6d6cc01581af39afdd9be298bcd7d77b67740c04c  # branch 1.82.0
  pullPolicy: IfNotPresent

extraEnv: []

## Extra variables added to the env ConfigMap. NEXT_PUBLIC_DEFAULT_MAINNET_CHAIN_ID and
## NEXT_PUBLIC_APP_URL here take precedence over config.defaultChainId and config.appUrl.
extraEnvVars: {}

config:
  safeVersion: "1.4.1+L2"
  ## Chain selected when the app opens (XRPL EVM mainnet).
  defaultChainId: "1440000"
  ## Public origin of the app, used for link previews. Defaults to https://<ingress.host> when ingress is enabled.
  appUrl: ""
  clientGateway:
    url: "https://cgw-service.minikube.net"
  walletConnect:
    projectId: ""
    bridge: ""

web:
  nodeSelector: {}
  affinity: {}
  tolerations: {}
  securityContext: {}
  podSecurityContext: {}
  resources: {}

## HTTP basic auth in an nginx sidecar in front of the app. It works with any ingress class (ALB, nginx).
## /healthz stays open for load balancer health checks: 200 when the app answers /welcome, 500 when not.
basicAuth:
  enabled: false
  user: ""
  password: ""

ingress:
  enabled: true
  ingressClassName: nginx
  host: safe-wallet.minikube.net
  annotations:
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/enable-cors: "false"
  tls:
    enabled: false
    #host: 
    #secretName:
